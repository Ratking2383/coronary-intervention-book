name: Daily coronary intervention research draft

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect recent research
        run: python scripts/daily_research.py

      - name: Create review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          BRANCH="automated-draft-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add drafts/news/
          if git diff --cached --quiet; then
            echo "No draft changes to submit."
            exit 0
          fi
          git commit -m "Add daily coronary intervention research draft ${DATE}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Daily coronary intervention research draft ${DATE}" \
            --body "Automated draft for editorial and medical review. This PR must be reviewed before merging. Sources are collected from Europe PMC and may be incomplete or misclassified. Do not treat the draft as clinical guidance."
